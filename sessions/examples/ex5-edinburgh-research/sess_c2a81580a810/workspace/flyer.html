<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Haymarket Tap — 2026-04-25</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; max-width: 640px;
         margin: 2em auto; padding: 1.5em; border: 1px solid #999;
         background: #fdfaf3; color: #222; }
  h1 { margin: 0 0 .2em 0; font-size: 1.9em; }
  .tagline { font-style: italic; color: #555; margin: 0 0 1em 0; }
  dl { display: grid; grid-template-columns: 12em 1fr; gap: .3em 1em; }
  dt { font-weight: bold; color: #444; }
  dd { margin: 0; }
  .total { font-size: 1.2em; }
</style>
</head>
<body>
<article>
  <h1 data-testid="venue_name">Haymarket Tap</h1>
  <p class="tagline">An Edinburgh evening — booked by your AI agent.</p>

  <dl>
    <dt>Address</dt>      <dd data-testid="venue_address">12 Dalry Rd, Edinburgh EH11 2BG</dd>
    <dt>Date</dt>         <dd data-testid="date">2026-04-25</dd>
    <dt>Time</dt>         <dd data-testid="time">19:30</dd>
    <dt>Party size</dt>   <dd data-testid="party_size">6</dd>
    <dt>Weather</dt>      <dd>
        <span data-testid="condition">cloudy</span>,
        <span data-testid="temperature_c">12</span>°C
    </dd>
    <dt>Total</dt>        <dd class="total"><span data-testid="total_gbp">£356</span></dd>
    <dt>Deposit</dt>      <dd><span data-testid="deposit_required_gbp">£71</span></dd>
  </dl>
</article>
</body>
</html>
